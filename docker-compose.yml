services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: production_rescue
      POSTGRES_PASSWORD: production_rescue
      POSTGRES_DB: production_rescue
    ports:
      - "5432:5432"
    volumes:
      - pr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U production_rescue"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://production_rescue:production_rescue@db:5432/production_rescue
      CORS_ORIGINS: http://localhost:3000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-us-central1}
      PARALLEL_API_KEY: ${PARALLEL_API_KEY:-}
    ports:
      - "8000:8000"
    command: >
      sh -c "python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        NEXT_PUBLIC_DEMO_MODE: "true"
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pr_pgdata:
